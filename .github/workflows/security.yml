name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Security regression tests
        run: node --test tests/security.test.mjs
      - name: Install checksum-verified secret scanner
        run: |
          curl --fail --silent --show-error --location --retry 3 --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan history and downloadable archives
        run: |
          /tmp/gitleaks git . --log-opts='--all' --redact=100 --no-banner
          /tmp/gitleaks dir . --max-archive-depth=3 --redact=100 --no-banner
