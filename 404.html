<script>
// Point a mistyped address at the page it most likely meant. No automatic
// redirect: a timed bounce hides the real page from people and from Google.
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase().replace(/[^a-z]/g, '');
  var guesses = [
    [/scrol|sitegen|skill/, '/scroll-site-generator-skill', 'Scroll Site Generator skill'],
    [/motion|director/, '/motion-director-skill', 'Motion Director skill'],
    [/reel/, '/reel-automation', 'AI Reel Engine'],
    [/agen/, '/agency', 'AI agency playbook'],
    [/content|contand/, '/content-automation', 'Content automation'],
    [/idea|shop|store|pric|cours|product/, '/products', 'Products'],
    [/tool|calc|generator/, '/tools', 'Free tools'],
    [/blog|post/, '/blog', 'Blog']
  ];
  for (var i = 0; i < guesses.length; i++) {
    if (guesses[i][0].test(p)) {
      document.getElementById('nfSub').textContent = 'Were you looking for this?';
      var first = document.querySelector('#nfLinks .btn-primary');
      first.href = guesses[i][1]; first.textContent = guesses[i][2] + ' →';
      return;
    }
  }
})();
